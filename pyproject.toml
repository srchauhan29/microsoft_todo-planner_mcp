[project]
name = "todo-planner-mcp"
version = "0.2.0"
description = "Local MCP server for Microsoft To Do and Microsoft Planner via Microsoft Graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "msal>=1.31",
    "msal-extensions>=1.2",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "tzlocal>=5.2",
]

[project.scripts]
todo-planner-mcp = "todo_planner_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_planner_mcp"]
